services:
  backend:
    build: ./backend
    restart: always
    env_file: ./backend/.env
    volumes:
      - backend_data:/app/data
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "9527:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  backend_data:
